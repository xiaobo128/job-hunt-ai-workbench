<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Agent 数据修改流程</title>
  <desc id="desc">Agent 创建修改建议，工作台向用户展示依据，只有用户确认后才更新数据库；拒绝时保留原数据。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .node { stroke: #cbd5e1; stroke-width: 1.5; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .label { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .edge-label { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #475569; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="380" fill="#ffffff"/>

  <path class="line" d="M 200 111 H 240"/>
  <path class="line" d="M 430 111 H 470"/>
  <path class="line" d="M 690 111 H 730"/>
  <path class="line" d="M 950 111 H 970"/>
  <path class="line" d="M 1080 166 V 250"/>
  <path class="line" d="M 1004 149 C 965 180, 950 245, 910 286"/>

  <rect x="388" y="42" width="124" height="24" rx="12" fill="#ffffff"/>
  <text class="edge-label" x="450" y="59">创建 Proposal</text>
  <rect x="1010" y="196" width="140" height="24" rx="12" fill="#ffffff"/>
  <text class="edge-label" x="1080" y="213">确认</text>
  <rect x="912" y="202" width="72" height="24" rx="12" fill="#ffffff"/>
  <text class="edge-label" x="948" y="219">拒绝</text>

  <rect class="node" x="20" y="75" width="180" height="72" rx="18" fill="#eff6ff"/>
  <text class="label" x="110" y="101">👤 用户发出</text>
  <text class="label" x="110" y="122">更新指令</text>

  <rect class="node" x="240" y="75" width="190" height="72" rx="18" fill="#f5f3ff"/>
  <text class="label" x="335" y="111">🤖 AI Agent</text>

  <rect class="node" x="470" y="75" width="220" height="72" rx="18" fill="#f8fafc"/>
  <text class="label" x="580" y="101">🖥️ Job Hunt</text>
  <text class="label" x="580" y="122">Workbench</text>

  <rect class="node" x="730" y="75" width="220" height="72" rx="18" fill="#fff7ed"/>
  <text class="label" x="840" y="101">显示待确认修改</text>
  <text class="label" x="840" y="122">与来源依据</text>

  <path class="node" d="M 1080 56 L 1190 111 L 1080 166 L 970 111 Z" fill="#fefce8"/>
  <text class="label" x="1080" y="111">用户决定</text>

  <rect class="node" x="690" y="250" width="220" height="72" rx="18" fill="#f8fafc"/>
  <text class="label" x="800" y="286">保留原数据</text>

  <path class="node" d="M 970 262 C 970 246, 1190 246, 1190 262 V 316 C 1190 332, 970 332, 970 316 Z" fill="#ecfdf5"/>
  <ellipse class="node" cx="1080" cy="262" rx="110" ry="12" fill="#f0fdf4"/>
  <text class="label" x="1080" y="291">更新数据库</text>
</svg>
