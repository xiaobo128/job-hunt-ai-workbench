<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Web 与 AI Agent 协作流程</title>
  <desc id="desc">用户通过 Web 工作台导入并确认求职数据，AI Agent 读取已确认信息、生成辅助结果，并将修改建议交回用户确认。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .node { stroke: #cbd5e1; stroke-width: 1.5; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .label { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .edge-label { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #475569; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>

  <!-- Connections are drawn first so they stay behind the nodes. -->
  <path class="line" d="M 490 72 C 420 72, 330 122, 205 160"/>
  <path class="line" d="M 710 72 C 1080 72, 1130 315, 995 570"/>
  <path class="line" d="M 205 232 V 300"/>
  <path class="line" d="M 250 336 H 290"/>
  <path class="line" d="M 510 336 H 550"/>
  <path class="line" d="M 770 336 H 780"/>
  <path class="line" d="M 900 387 V 450"/>
  <path class="line" d="M 1020 336 H 1160 V 132 H 205 V 160"/>
  <path class="line" d="M 900 528 V 548 H 995 V 570"/>
  <path class="line" d="M 870 606 H 750"/>
  <path class="line" d="M 870 590 H 815 V 420 H 660 V 372"/>
  <path class="line" d="M 470 606 H 20 V 72 H 490"/>

  <rect x="348" y="82" width="168" height="26" rx="13" fill="#ffffff"/>
  <text class="edge-label" x="432" y="100">操作与确认</text>
  <rect x="911" y="166" width="170" height="26" rx="13" fill="#ffffff"/>
  <text class="edge-label" x="996" y="184">提问或交办任务</text>
  <rect x="860" y="409" width="80" height="26" rx="13" fill="#ffffff"/>
  <text class="edge-label" x="900" y="427">确认</text>
  <rect x="1052" y="219" width="92" height="26" rx="13" fill="#ffffff"/>
  <text class="edge-label" x="1098" y="237">拒绝或修正</text>
  <rect x="906" y="534" width="178" height="26" rx="13" fill="#ffffff"/>
  <text class="edge-label" x="995" y="552">读取已授权、已确认的信息</text>
  <rect x="555" y="432" width="190" height="26" rx="13" fill="#ffffff"/>
  <text class="edge-label" x="650" y="450">提交阶段变更建议</text>
  <rect x="755" y="576" width="98" height="26" rx="13" fill="#ffffff"/>
  <text class="edge-label" x="804" y="594">生成结果</text>

  <rect class="node" x="490" y="40" width="220" height="64" rx="18" fill="#eff6ff"/>
  <text class="label" x="600" y="72">👤 用户</text>

  <rect class="node" x="80" y="160" width="250" height="72" rx="18" fill="#f8fafc"/>
  <text class="label" x="205" y="196">🖥️ Web 工作台</text>

  <rect class="node" x="40" y="300" width="210" height="72" rx="18" fill="#f8fafc"/>
  <text class="label" x="145" y="327">导入岗位、简历</text>
  <text class="label" x="145" y="348">或招聘通知</text>

  <rect class="node" x="290" y="300" width="220" height="72" rx="18" fill="#f5f3ff"/>
  <text class="label" x="400" y="327">需要时由 AI 解析</text>
  <text class="label" x="400" y="348">与结构化</text>

  <rect class="node" x="550" y="300" width="220" height="72" rx="18" fill="#fff7ed"/>
  <text class="label" x="660" y="327">待核对结果</text>
  <text class="label" x="660" y="348">或待确认操作</text>

  <path class="node" d="M 900 285 L 1020 336 L 900 387 L 780 336 Z" fill="#fefce8"/>
  <text class="label" x="900" y="336">用户确认？</text>

  <path class="node" d="M 790 462 C 790 446, 1010 446, 1010 462 V 516 C 1010 532, 790 532, 790 516 Z" fill="#ecfdf5"/>
  <ellipse class="node" cx="900" cy="462" rx="110" ry="12" fill="#f0fdf4"/>
  <text class="label" x="900" y="491">求职数据更新</text>

  <rect class="node" x="870" y="570" width="250" height="72" rx="18" fill="#f5f3ff"/>
  <text class="label" x="995" y="606">🤖 AI Agent</text>

  <rect class="node" x="470" y="570" width="280" height="72" rx="18" fill="#eff6ff"/>
  <text class="label" x="610" y="595">总结进展 · 分析匹配</text>
  <text class="label" x="610" y="617">准备面试</text>
</svg>
